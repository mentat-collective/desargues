name: test

# Pure test suites, the raster dynamics conformance suite and the Typed
# Clojure gate. The Manim-backed suites need a conda `manim` env, which CI
# does not provide; they skip themselves, which is expected here.
# Benchmarks are deliberately not run: shared runners are too noisy.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (pure suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: test-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: test-${{ runner.os }}-
      - run: clojure -M:test

  dynamics:
    name: test (raster dynamics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # raster compiles kernels with java.lang.classfile (final in JDK 24).
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: dynamics-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: dynamics-${{ runner.os }}-
      # The :gpu backend's tests need an OpenCL platform. Runners have no GPU,
      # so install the ICD loader and POCL (CPU OpenCL) and ask raster for a
      # CPU device; the GPU code path then runs for real in CI.
      - name: Install OpenCL (ICD loader + POCL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ocl-icd-libopencl1 pocl-opencl-icd
      # JVM flags (--add-modules=jdk.incubator.vector,
      # --enable-native-access=ALL-UNNAMED) come from the :dynamics alias.
      - run: clojure -M:test:dynamics
        env:
          RASTER_OCL_DEVICE_TYPE: cpu

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: typecheck-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: typecheck-${{ runner.os }}-
      - run: clojure -M:dev -m desargues.typecheck
